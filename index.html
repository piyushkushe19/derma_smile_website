<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
<title>Derma Smile Aesthetic Clinic | Skin, Hair, Laser & Slimming in Bangalore</title>
<meta name="description" content="Advanced dermatology and aesthetic care in Bangalore. Book a free consultation at Derma Smile.">
<link rel="icon" href="https://dermasmileaesthetics.com/wp-content/uploads/2026/09/cropped-derma-smile-logo-32x32.png">
<link rel="apple-touch-icon" href="https://dermasmileaesthetics.com/wp-content/uploads/2026/09/cropped-derma-smile-logo-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=MuseoModerno:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ========== CEVORA LAYOUT + DERMA SMILE GOLD ========== */
:root{
  --ink:#1A1A1A;
  --ink-soft:#2a2a2a;
  --muted:#5c5c5c;
  --accent:#C8792C;
  --accent-2:#91551B;
  --accent-soft:rgba(200,121,44,.16);
  --white:#fff;
  --fog:#F5F5F5;
  --cream:#F7F3F0;
  --glass:rgba(255,255,255,.4);
  --glass-dark:rgba(255,255,255,.12);
  --max:1200px;
  --r:24px;
  --r-lg:32px;
  --r-pill:100px;
  --pad:clamp(16px,4vw,48px);
  --display:'MuseoModerno',system-ui,sans-serif;
  --sans:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{
  font:400 16px/1.55 var(--sans);
  color:var(--ink);
  background:var(--white);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
h1,h2,h3,.display{
  font-family:var(--display);
  font-weight:500;
  letter-spacing:-.02em;
  line-height:1.05;
}
h1{font-size:clamp(42px,5.6vw,74px)}
h2{font-size:clamp(34px,4.4vw,64px)}
h3{font-size:clamp(22px,2vw,28px)}
.lead{font-size:clamp(15px,1.15vw,18px);color:var(--muted);max-width:46ch}
.wrap{width:min(100% - var(--pad)*2,var(--max));margin:0 auto}
.sec{padding:clamp(64px,9vw,120px) 0;position:relative}
.sec-fog{background:var(--fog)}
.sec-cream{
  background:
    radial-gradient(at 20% 30%, rgba(200,121,44,.06) 0%, transparent 60%),
    radial-gradient(at 80% 70%, rgba(169,133,72,.05) 0%, transparent 55%),
    var(--cream);
}
.paper:before{
  content:"";
  position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-linear-gradient(0deg,transparent,transparent .8px,rgba(139,69,19,.07) .8px,rgba(139,69,19,.07) 1.6px),
    repeating-linear-gradient(90deg,transparent,transparent .8px,rgba(139,69,19,.07) .8px,rgba(139,69,19,.07) 1.6px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse at center,black 40%,transparent 85%);
}
.round{border-radius:var(--r);overflow:hidden}
.round-lg{border-radius:var(--r-lg);overflow:hidden}

/* Badge */
.badge{
  display:inline-flex;align-items:center;gap:8px;
  height:28px;padding:0 12px 0 8px;border-radius:var(--r-pill);
  background:var(--accent);color:#fff;font-size:12px;font-weight:600;
}
.badge.glass{
  background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.badge .plus{
  width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);
  display:grid;place-items:center;font-size:11px;line-height:1;
}
.badge.light{background:#fff;color:var(--accent)}
.badge.light .plus{background:var(--accent-soft);color:var(--accent)}

/* Buttons — Cevora: dark pill + accent arrow circle */
.btn{
  display:inline-flex;align-items:center;gap:14px;
  height:46px;padding:0 10px 0 24px;border-radius:var(--r-pill);
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;
  transition:transform .45s var(--ease), background .45s var(--ease), color .45s var(--ease);
  position:relative;
}
.btn .arr{
  width:42px;height:42px;border-radius:50%;background:var(--accent);
  display:grid;place-items:center;transition:transform .45s var(--ease), background .45s var(--ease);
  flex:none;
}
.btn .arr svg{width:16px;height:16px;display:block}
.btn:hover{background:#000;transform:scale(1.03)}
.btn:hover .arr{transform:translateX(4px) scale(1.05)}
.btn.accent{background:var(--accent);color:#fff;padding:0 18px;height:36px;font-size:12px}
.btn.accent .arr{display:none}
.btn.accent:hover{background:var(--ink);transform:scale(1.04)}
.btn.ghost{
  background:rgba(26,26,26,.55);backdrop-filter:blur(8px);color:#fff;
}
.btn.sm{height:36px;padding:0 14px;font-size:12px;gap:8px}
.btn.sm .arr{width:28px;height:28px}
.btn.sm .arr svg{width:12px;height:12px}

/* Header / Nav — centered frosted pill */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:20px var(--pad);pointer-events:none;
  transition:transform .55s var(--ease);
}
.site-header.hide{transform:translateY(-120%)}
.nav{
  pointer-events:auto;
  width:min(700px,100%);
  margin:0 auto;
  height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 22px;gap:12px;
  border-radius:var(--r-pill);
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 12px -4px rgba(0,0,0,.12);
}
.logo{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:500}
.nav-links a{opacity:.78;transition:opacity .3s}
.nav-links a:hover,.nav-links a.on{opacity:1}
.burger{
  display:none;width:40px;height:40px;border-radius:50%;background:#fff;
  place-items:center;flex-direction:column;gap:5px;
}
.burger i{display:block;width:14px;height:1.5px;background:var(--ink);transition:.35s}
.drawer{
  position:fixed;inset:0;z-index:99;background:rgba(26,26,26,.96);color:#fff;
  display:flex;flex-direction:column;justify-content:center;gap:8px;padding:var(--pad);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease), visibility .45s;
}
.drawer.open{opacity:1;visibility:visible}
.drawer a{font:500 clamp(36px,10vw,56px)/1.15 var(--display)}
.drawer .close{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:20px}

/* Hero */
.hero{
  position:relative;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;color:#fff;overflow:hidden;
}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 20%;transform:scale(1.08);will-change:transform}
.hero-overlay{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(270deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,.58) 72%);
}
.hero-grid{
  position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.35;
  background:
    linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
  background-size:50% 50%;
  background-position:center;
  mask-image:radial-gradient(ellipse at 60% 40%, black 10%, transparent 70%);
}
.hero-inner{
  position:relative;z-index:3;width:min(100% - var(--pad)*2,var(--max));margin:0 auto;
  display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;
  padding:110px 0 56px;min-height:100vh;min-height:100dvh;
}
.hero-copy{max-width:600px}
.hero-copy h1{color:#fff;margin:14px 0 14px;max-width:11ch}
.hero-copy .lead{color:rgba(255,255,255,.86);margin-bottom:22px}
.hero-rating{
  margin-top:28px;width:min(100%,293px);
  padding:18px 20px;border-radius:24px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.hero-rating strong{display:block;font:500 34px/1 var(--display);margin-bottom:10px}
.hero-rating .avs{display:flex;margin-bottom:8px}
.hero-rating .avs span{
  width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  margin-left:-10px;background:var(--fog);overflow:hidden;
}
.hero-rating .avs span:first-child{margin-left:0}
.hero-rating small{opacity:.85;font-size:12px}
.hero-float{
  justify-self:end;width:min(100%,350px);height:min(500px,62vh);aspect-ratio:7/10;
  border-radius:20px;overflow:hidden;position:relative;
  background:rgba(255,255,255,.2);backdrop-filter:blur(8px);
  box-shadow:0 24px 70px rgba(0,0,0,.28);
  align-self:center;margin-top:24px;
}
.hero-float img{position:absolute;inset:0;transition:opacity .8s var(--ease)}
.hero-float .cap{
  position:absolute;left:12px;right:12px;bottom:12px;padding:16px;
  border-radius:16px;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);
  font-size:14px;line-height:1.4;
}
.hero-float .cap b{display:block;margin-top:8px;font-size:12px;font-weight:600;opacity:.85}

/* Centered section intro */
.center-intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:2}
.center-intro h2{max-width:14ch}
.center-intro .lead{margin:0 auto}

/* Floating feature cards (Treatment Overview) */
.overview{position:relative;min-height:clamp(720px,90vw,1100px);overflow:hidden}
.overview .center-intro{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(640px,90%);z-index:2}
.float-card{
  position:absolute;width:min(300px,78vw);padding:28px 24px;border-radius:var(--r-lg);
  background:var(--accent);color:#fff;z-index:3;
  box-shadow:0 18px 50px rgba(200,121,44,.28);
  will-change:transform;
  transition:transform .45s var(--ease), box-shadow .45s var(--ease);
}
.float-card:hover{box-shadow:0 24px 60px rgba(200,121,44,.36)}
.float-card .ico{
  width:40px;height:40px;border-radius:50%;background:#fff;color:var(--accent);
  display:grid;place-items:center;margin-bottom:18px;font-size:18px;
}
.float-card h3{color:#fff;font-family:var(--sans);font-size:20px;font-weight:600;margin-bottom:8px;letter-spacing:0}
.float-card p{font-size:14px;line-height:1.45;opacity:.92}
.fc-1{left:max(4%, calc(50% - 560px));top:12%}
.fc-2{right:max(4%, calc(50% - 560px));top:22%}
.fc-3{left:max(8%, calc(50% - 480px));bottom:10%}
.fc-4{right:max(6%, calc(50% - 500px));bottom:8%}

/* Why / About image with glass stats */
.why-block{text-align:center;max-width:720px;margin:0 auto 48px}
.why-media{position:relative;width:min(480px,92%);margin:48px auto 0}
.why-media .ph{aspect-ratio:1;border-radius:18px;overflow:hidden}
.stat-glass{
  position:absolute;width:min(250px,72%);padding:22px 20px;border-radius:var(--r);
  background:rgba(255,255,255,.58);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 12px 40px rgba(0,0,0,.1);text-align:left;z-index:2;
}
.stat-glass strong{display:block;font:500 42px/1 var(--display);margin-bottom:6px}
.stat-glass b{display:block;font-size:15px;margin-bottom:6px}
.stat-glass p{font-size:13px;color:var(--muted);line-height:1.4}
.stat-l{left:-16%;top:16%}
.stat-r{right:-16%;bottom:6%}

/* Doctor / benefits split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.split .ph{aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;position:relative}
.doc-chip{
  position:absolute;left:14px;bottom:14px;right:14px;max-width:320px;
  padding:14px 16px;border-radius:16px;
  background:rgba(0,0,0,.22);backdrop-filter:blur(12px);color:#fff;
}
.doc-chip b{display:block;font-size:16px}
.doc-chip span{font-size:13px;opacity:.85}
.benefit-list{display:flex;flex-direction:column;gap:16px;margin:28px 0}
.benefit-list li{display:flex;gap:14px;align-items:flex-start;font-size:15px;font-weight:500}
.benefit-list .n{
  flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:16px;
}

/* Testimonials */
.t-sec{
  position:relative;overflow:hidden;color:var(--ink);
  background:#87B8D8 center/cover no-repeat;
  min-height:760px;display:flex;align-items:center;
}
.t-sec .bg{position:absolute;inset:0}
.t-sec .bg img{width:100%;height:100%;object-fit:cover}
.t-sec .veil{position:absolute;inset:0;background:rgba(255,255,255,.08)}
.t-inner{position:relative;z-index:2;width:min(100% - var(--pad)*2,900px);margin:0 auto;text-align:center}
.t-card{
  margin-top:36px;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:stretch;
  padding:28px;border-radius:var(--r-lg);text-align:left;
  background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.08);
  min-height:320px;
}
.t-card .quote{display:flex;flex-direction:column;justify-content:space-between;padding:12px 8px}
.t-card .quote p{font-size:clamp(17px,1.5vw,22px);line-height:1.45;font-weight:500}
.t-card .who b{display:block;font-size:15px}
.t-card .who span{font-size:13px;color:var(--muted)}
.t-card .pic{border-radius:20px;overflow:hidden;min-height:240px}
.dots{
  margin:22px auto 0;display:inline-flex;gap:8px;padding:8px 12px;border-radius:99px;
  background:rgba(200,121,44,.25);
}
.dots button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);transition:.35s}
.dots button.on{background:var(--accent);transform:scale(1.2)}

/* Flip treatment cards */
.cards-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px;
}
.flip{
  perspective:1400px;cursor:pointer;height:450px;
}
.flip-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform .9s var(--ease-out);
}
.flip:hover .flip-inner,.flip.on .flip-inner{transform:rotateY(180deg)}
.flip-face{
  position:absolute;inset:0;border-radius:var(--r);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.06);
  display:flex;flex-direction:column;padding:16px;
  transition:box-shadow .45s var(--ease);
}
.flip:hover .flip-face{box-shadow:0 16px 40px rgba(0,0,0,.1)}
.flip-face .media{flex:1;border-radius:18px;overflow:hidden;min-height:0}
.flip-face h3{margin:14px 4px 6px;font-family:var(--sans);font-size:20px;font-weight:650;letter-spacing:0}
.flip-face .desc{margin:0 4px 14px;font-size:14px;color:var(--muted);line-height:1.45;flex:none}
.flip-face .btn.accent{align-self:flex-start;margin:0 4px 4px}
.flip-back{transform:rotateY(180deg);background:var(--ink);color:#fff;padding:28px;justify-content:space-between}
.flip-back h4{color:var(--accent);font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px}
.flip-back li{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.flip-back .btn{align-self:flex-start;margin-top:18px}

/* FAQ */
.faq-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(24px,4vw,64px);align-items:start}
.faq-card{
  margin-top:28px;padding:24px;border-radius:26px;background:var(--fog);
  display:flex;flex-direction:column;gap:20px;min-height:180px;
}
.faq-card .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.faq-card .ava{width:56px;height:56px;border-radius:50%;overflow:hidden;background:#ddd}
.fq{margin-bottom:8px}
.fq button{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;
  text-align:left;padding:18px 20px;border-radius:16px;background:var(--fog);
  font-size:15px;font-weight:500;line-height:1.35;
}
.fq button em{font-style:normal;font-weight:700}
.fq .pm{
  flex:none;width:28px;height:28px;border-radius:50%;background:#fff;
  position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.fq .pm:before,.fq .pm:after{
  content:"";position:absolute;top:50%;left:50%;width:10px;height:1.5px;background:var(--ink);
  transform:translate(-50%,-50%);transition:.35s var(--ease);
}
.fq .pm:after{transform:translate(-50%,-50%) rotate(90deg)}
.fq.open .pm:after{transform:translate(-50%,-50%) rotate(0)}
.fq .ans{height:0;overflow:hidden}
.fq .ans p{padding:4px 20px 16px;color:var(--muted);font-size:14px;max-width:56ch}

/* Blog */
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.post{
  background:var(--fog);border-radius:var(--r-lg);overflow:hidden;
  transition:transform .5s var(--ease);
  display:flex;flex-direction:column;
}
.post:hover{transform:translateY(-8px);box-shadow:0 16px 40px rgba(0,0,0,.08)}
.post .media{aspect-ratio:16/11;position:relative}
.post .tag{
  position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(8px);font-size:12px;font-weight:600;
}
.post .body{padding:18px 20px 24px}
.post .meta{font-size:12px;color:#999;margin-bottom:8px}
.post h3{font-family:var(--sans);font-size:18px;font-weight:650;letter-spacing:0;margin-bottom:8px}
.post p{font-size:14px;color:var(--muted);line-height:1.45}

/* CTA */
.cta-wrap{
  position:relative;padding:clamp(40px,6vw,80px) 0;overflow:hidden;
  background:#9ec6df center/cover no-repeat;
}
.cta-wrap .bg{position:absolute;inset:0}
.cta-wrap .bg img{width:100%;height:100%;object-fit:cover}
.cta-box{
  position:relative;z-index:2;width:min(100% - var(--pad)*2,var(--max));margin:0 auto;
  display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;
  padding:clamp(24px,3vw,40px);border-radius:var(--r-lg);
  background:rgba(255,255,255,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.cta-box .ph{aspect-ratio:5/4;border-radius:20px;overflow:hidden}
.cta-box h2{margin:14px 0 12px}

/* Page hero (inner) */
.page-hero{
  padding:140px 0 40px;text-align:center;
  background:
    radial-gradient(at 20% 30%, rgba(200,121,44,.07) 0%, transparent 55%),
    var(--fog);
}
.page-hero h1{margin:14px auto 16px;max-width:14ch}
.page-hero .lead{margin:0 auto 24px}
.page-hero .hero-media{width:min(100% - var(--pad)*2,var(--max));margin:36px auto 0;aspect-ratio:21/8;border-radius:var(--r-lg);overflow:hidden}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:36px}
.step{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.04)}
.step .ph{aspect-ratio:4/3}
.step .t{padding:20px}
.step h4{font-family:var(--sans);font-size:18px;font-weight:650;letter-spacing:0;margin-bottom:6px}
.step h4:before{content:attr(data-n);display:block;font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:600}
.step p{font-size:14px;color:var(--muted)}

/* Areas / results */
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.areas figure{aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative}
.areas figcaption{
  position:absolute;inset:auto 0 0;padding:16px;color:#fff;
  font:500 18px/1.2 var(--display);
  background:linear-gradient(transparent,rgba(0,0,0,.65));
}
.res-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}
.res-grid figure{aspect-ratio:3/2;border-radius:var(--r);overflow:hidden;position:relative}
.res-grid figcaption{
  position:absolute;left:14px;bottom:14px;padding:6px 14px;border-radius:99px;
  background:rgba(255,255,255,.92);font-size:13px;font-weight:600;
}
.ba{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;user-select:none;touch-action:pan-y}
.ba .af{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:3}
.ba .hd{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;z-index:2;pointer-events:none}
.ba .hd:after{
  content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);font-size:14px;
}
.ba .lb{position:absolute;bottom:12px;z-index:2;font-size:11px;font-weight:600;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:99px}
.bagrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.bagrid h3{font-family:var(--sans);font-size:20px;margin-top:12px;letter-spacing:0}

/* Contact */
.cgrid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.info-card{background:var(--fog);border-radius:var(--r-lg);padding:clamp(24px,3vw,40px)}
.info-card h4{font-family:var(--sans);font-size:15px;font-weight:650;color:var(--accent);margin:20px 0 6px;letter-spacing:0}
.info-card h4:first-child{margin-top:0}
.map{border-radius:var(--r-lg);overflow:hidden;min-height:420px}
.map iframe{width:100%;height:100%;min-height:420px;border:0}

/* About (Cevora structure) */
.ab-hero{padding:150px 0 0;text-align:center;background:var(--white)}
.ab-hero h1{max-width:12ch;margin:14px auto 0}
.ab-media{width:min(100% - var(--pad)*2,var(--max));margin:48px auto 0;aspect-ratio:21/9;border-radius:var(--r-lg);overflow:hidden}
.ab-phil{align-items:start}
.ab-sticky{position:sticky;top:130px}
.ab-stack .stk{position:sticky;margin-bottom:28px;transform-origin:center top}
.ab-stack .ph{aspect-ratio:4/5;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.hw{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,72px);margin-top:56px;align-items:start}
.hw-img{position:sticky;top:120px}
.hw-img .ph{aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden}
.hw-item{display:grid;grid-template-columns:64px 1fr;gap:20px;padding:38px 0;border-top:1px solid rgba(0,0,0,.12);opacity:.3;transition:opacity .6s var(--ease)}
.hw-item.on{opacity:1}
.hw-item .num{font:500 18px var(--display);color:var(--accent)}
.hw-item h3{font-size:clamp(26px,3vw,40px);margin-bottom:10px}
.hw-item p{color:var(--muted);max-width:40ch}
.founder{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:620px;display:grid;place-items:center;color:#fff;padding:clamp(32px,6vw,80px);text-align:center;will-change:transform}
.founder .bg{position:absolute;inset:0}
.founder .ov{position:absolute;inset:0;background:rgba(0,0,0,.58)}
.founder .fc{position:relative;z-index:2;max-width:860px;display:flex;flex-direction:column;align-items:center;gap:28px}
.fq-text{font:500 clamp(22px,2.8vw,38px)/1.3 var(--display);letter-spacing:-.01em}
.fq-text .sw{display:inline-block}
.fchip{display:flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;border-radius:99px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:left}
.fchip .av{width:44px;height:44px;border-radius:50%;overflow:hidden}
.fchip b{display:block;font-size:14px}.fchip span{font-size:12px;opacity:.8}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:48px}
.tm{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;color:#fff}
.tm img{transition:transform 1.1s var(--ease-out)}
.tm:hover img{transform:scale(1.08)}
.tm:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7))}
.tm .cap{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;padding:16px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tm .cap b{display:block;font-size:17px;font-weight:600}
.tm .cap span{font-size:13px;opacity:.85}
.tm .cap p{font-size:13px;opacity:.85;line-height:1.4;max-height:0;overflow:hidden;transition:max-height .6s var(--ease),margin .6s var(--ease)}
.tm:hover .cap p{max-height:90px;margin-top:8px}

/* Footer (Cevora style: photo backdrop + glass card + giant wordmark) */
.site-footer{position:relative;overflow:hidden;padding:clamp(40px,6vw,72px) 0 0;background:#9ec6df;color:#fff}
.ft-bg{position:absolute;inset:0}
.ft-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45))}
.site-footer .wrap{position:relative;z-index:2}
.ft-card{padding:clamp(28px,4vw,56px);border-radius:var(--r-lg);background:rgba(18,18,18,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1.1fr 1.3fr;gap:32px}
.fgrid .logo{color:#fff;margin-bottom:6px;display:inline-block;font-size:26px}
.fgrid .sub{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:14px}
.fgrid p{font-size:14px;opacity:.72;max-width:34ch;line-height:1.55}
.fgrid h5{font-size:13px;font-weight:600;color:rgba(255,255,255,.55);margin-bottom:16px;text-transform:uppercase;letter-spacing:.06em}
.fgrid li{margin-bottom:10px;font-size:14px;opacity:.9}
.fgrid li a{position:relative;display:inline-block;transition:color .3s,transform .4s var(--ease)}
.fgrid li a:hover{color:var(--accent);transform:translateX(4px)}
.socials{display:flex;gap:10px;margin-top:22px}
.socials a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);transition:background .4s var(--ease),transform .4s var(--ease)}
.socials a:hover{background:var(--accent);transform:translateY(-4px)}
.socials svg{width:17px;height:17px}
.copy{margin-top:40px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.copy span{opacity:.65}
.copy a{opacity:.85}.copy a:hover{color:var(--accent)}
.totop{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .4s var(--ease)}
.totop:hover{transform:translateY(-4px)}
.totop svg{width:16px;height:16px;transform:rotate(-90deg)}
.ft-mark{font:600 clamp(56px,15vw,210px)/.82 var(--display);letter-spacing:-.04em;text-align:center;white-space:nowrap;margin:28px 0 -.12em;color:rgba(255,255,255,.92);user-select:none}

/* Pinned Treatments overview (cards fly in on scroll) */
.ovp{position:relative;height:100vh;height:100dvh;overflow:hidden;color:var(--ink)}
.ovp-bg,.ovp-ov{position:absolute;inset:0}
.ovp-bg img{transform:scale(1.18);will-change:transform}
.ovp-ov{background:rgba(0,0,0,.3)}
.ovp-stage{position:absolute;inset:0}
.ovp-intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,90%)}
.ovp-card{position:absolute;width:min(270px,24vw);padding:26px 22px;border-radius:var(--r-lg);background:var(--accent);color:#fff;box-shadow:0 18px 50px rgba(200,121,44,.28);will-change:transform}
.ovp-card .ico{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;margin-bottom:16px;font-size:17px}
.ovp-card h3{font:600 19px/1.2 var(--sans);letter-spacing:0;margin-bottom:6px}
.ovp-card p{font-size:14px;opacity:.92;line-height:1.45}
.ovc-1{left:6%;top:12%}.ovc-2{right:6%;top:18%}.ovc-3{left:11%;bottom:10%}.ovc-4{right:10%;bottom:8%}
/* Inner pages */
.ct-info{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.ct-info>*{background:var(--fog);border-radius:var(--r);padding:22px;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.ct-info a:hover{transform:translateY(-6px);box-shadow:0 14px 36px rgba(0,0,0,.08)}
.ct-info b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ct-info span{font-size:15px;font-weight:500;line-height:1.4;display:block}
.ct-form{display:grid;gap:16px;background:var(--fog);padding:clamp(24px,3vw,40px);border-radius:var(--r-lg)}
.ct-form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.ct-form input,.ct-form select,.ct-form textarea{font:400 15px var(--sans);padding:14px 16px;border-radius:14px;border:1px solid rgba(0,0,0,.08);background:#fff;color:var(--ink);resize:vertical}
.ct-form input:focus,.ct-form select:focus,.ct-form textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.ct-form .f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ct-form .btn{justify-self:start;margin-top:4px}
.post .media{overflow:hidden}
.post .media img{transition:transform 1s var(--ease-out)}
.post:hover .media img{transform:scale(1.07)}
#prog{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--accent);transform-origin:left;transform:scaleX(0);z-index:101;pointer-events:none}
.why-media .ph{will-change:clip-path}
#loader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;pointer-events:none;color:var(--ink);clip-path:circle(150% at 50% 50%);
  background:radial-gradient(55% 48% at 50% 44%,rgba(200,121,44,.18),transparent 72%),radial-gradient(at 18% 82%,rgba(169,133,72,.12),transparent 55%),radial-gradient(at 85% 15%,rgba(255,255,255,.9),transparent 50%),var(--cream)}
.ld-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:min(340px,80vw)}
.ld-wrap{position:relative;display:grid;place-items:center;width:130px;height:130px}
.ld-wrap i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(200,121,44,.5);animation:ldr 2.4s var(--ease-out) infinite}
.ld-wrap i:nth-child(2){animation-delay:.8s}
.ld-wrap i:nth-child(3){animation-delay:1.6s}
@keyframes ldr{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.ld-drop{width:58px;height:73px;overflow:visible;position:relative;z-index:1;filter:drop-shadow(0 8px 16px rgba(200,121,44,.3))}
.ld-logo{font:600 clamp(30px,5vw,42px)/1 var(--display);letter-spacing:-.02em}
.ld-logo span{color:var(--accent)}
.ld-tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ld-bar{width:100%;height:2px;background:rgba(26,26,26,.1);border-radius:2px;overflow:hidden;margin-top:10px}
.ld-bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.ld-meta{width:100%;display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.ld-meta b{font-variant-numeric:tabular-nums;color:var(--ink)}
.logo img{width:auto;height:38px;max-width:190px;object-fit:contain;display:block}
.ld-logo img{width:auto;height:54px;max-width:260px;object-fit:contain;margin:0 auto;display:block}
/* Word reveal helpers */
.u{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.u>span{display:inline-block;will-change:transform}
.reveal-y{will-change:transform,opacity}

/* Utilities */
.mt{margin-top:28px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.nf{min-height:70vh;display:grid;place-content:center;text-align:center;gap:18px;justify-items:center;padding:120px var(--pad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* Responsive */
@media(max-width:1024px){
  .ct-info{grid-template-columns:repeat(2,1fr)}
  .team-grid{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr 1fr}
  .cards-grid,.blog-grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .areas{grid-template-columns:repeat(3,1fr)}
  .stat-l{left:-4%}
  .stat-r{right:-4%}
  .overview{min-height:980px}
}
@media(max-width:860px){
  .ovp{height:auto;padding:90px 0 56px}.ovp-stage{position:relative;display:grid;gap:14px;width:min(100% - var(--pad)*2,460px);margin:0 auto}
  .ovp-intro{position:relative;left:auto;top:auto;transform:none;width:100%;margin-bottom:20px}
  .ovp-card{position:relative;width:100%;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important}
  .ct-form .f2{grid-template-columns:1fr}
  .ab-sticky,.hw-img{position:static}.hw{grid-template-columns:1fr}.ab-media{aspect-ratio:16/10}.ab-stack .stk{position:relative;top:auto!important}.founder{min-height:520px}
  .nav-links,.nav .btn{display:none}
  .burger{display:grid;order:0}
  .nav .logo{margin-left:auto;order:2}
  .nav{width:100%;padding:0 10px 0 10px;height:56px;justify-content:flex-start;gap:10px}
  .hero-inner{grid-template-columns:1fr;padding:100px 0 48px;align-items:end;min-height:100vh}
  .hero-float{display:none}
  .hero-overlay{background:linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.62) 100%)}
  .hero-copy h1{max-width:12ch}
  .overview{min-height:auto;padding:80px 0 40px}
  .overview .center-intro{position:relative;left:auto;top:auto;transform:none;width:100%;margin-bottom:28px}
  .float-card{position:relative;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:100%;margin:0 auto 14px}
  .float-stack{display:grid;gap:14px;width:min(100%,420px);margin:0 auto}
  .split,.faq-grid,.cta-box,.cgrid,.t-card{grid-template-columns:1fr}
  .t-card .pic{aspect-ratio:16/10;min-height:0}
  .cards-grid,.blog-grid,.bagrid,.res-grid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .why-media{width:100%}
  .stat-glass{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:100%;margin-top:12px}
  .why-stats{display:grid;gap:12px;margin-top:16px}
  .flip{height:420px}
  .page-hero .hero-media{aspect-ratio:16/9}
}
@media(max-width:520px){
  .steps,.areas,.fgrid,.team-grid,.ct-info{grid-template-columns:1fr}
  .hero-rating{width:100%}
  h1{font-size:clamp(36px,11vw,48px)}
}


/* ========================================================================
   RESPONSIVE LAYER — additive only (content, GSAP/Lenis animations untouched)
   Covers: 280px phones → tablets → laptops → 4K / ultra-wide
   ======================================================================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:280px;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
img,svg,video,iframe{max-width:100%}
h1,h2,h3,.display{overflow-wrap:break-word;hyphens:manual}
.site-header{padding-top:max(20px,env(safe-area-inset-top));padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right))}
.drawer{padding-top:max(var(--pad),env(safe-area-inset-top));padding-bottom:max(var(--pad),env(safe-area-inset-bottom));overflow-y:auto}
.drawer .close{top:max(22px,env(safe-area-inset-top))}
.site-footer{padding-bottom:env(safe-area-inset-bottom)}
.ct-form input,.ct-form select,.ct-form textarea{width:100%;min-width:0;max-width:100%}
.map iframe{display:block}
.btn,.burger,.dots button,.fq button,.totop{touch-action:manipulation}

/* ---------- Ultra-wide / large desktop ---------- */
@media(min-width:1440px){
  :root{--max:1320px}
  body{font-size:17px}
  .nav{width:min(760px,100%)}
}
@media(min-width:1920px){
  :root{--max:1480px;--pad:64px}
  body{font-size:18px}
  h1{font-size:clamp(74px,4.2vw,96px)}
  h2{font-size:clamp(64px,3.4vw,84px)}
  .lead{font-size:19px}
  .hero-copy{max-width:680px}
  .hero-float{width:min(100%,400px);height:min(560px,62vh)}
  .ovp-card{width:min(300px,18vw)}
  .t-sec{min-height:860px}
  .t-inner{width:min(100% - var(--pad)*2,1000px)}
  .flip{height:500px}
}
@media(min-width:2560px){
  :root{--max:1760px}
  body{font-size:20px}
  .lead{font-size:21px}
  .nav{width:min(880px,100%);height:68px}
  .ovp-card{width:min(340px,15vw)}
}

/* ---------- Laptops / small desktops (1025–1280) ---------- */
@media(max-width:1280px){
  .fgrid{gap:28px}
  .hero-inner{gap:28px}
}

/* ---------- Pinned overview: keep cards clear of the intro on mid widths ---------- */
@media(min-width:861px) and (max-width:1200px){
  .ovp-intro{width:min(46vw,520px)}
  .ovp-intro h2{font-size:clamp(30px,4vw,48px);max-width:12ch}
  .ovp-card{width:min(240px,25vw);padding:20px 18px}
  .ovp-card h3{font-size:17px}
  .ovp-card p{font-size:13px}
  .ovc-1{left:3%;top:10%}.ovc-2{right:3%;top:14%}
  .ovc-3{left:4%;bottom:8%}.ovc-4{right:4%;bottom:6%}
}
/* short landscape screens with the pinned layout */
@media(min-width:861px) and (max-height:700px){
  .ovp-intro h2{font-size:clamp(28px,4vh + 1vw,44px)}
  .ovp-intro .lead{font-size:14px}
  .ovp-card{padding:16px 16px;width:min(230px,24vw)}
  .ovp-card .ico{width:32px;height:32px;margin-bottom:10px;font-size:14px}
  .ovp-card h3{font-size:16px}
  .ovp-card p{font-size:12.5px;line-height:1.35}
  .ovc-1,.ovc-2{top:7%}.ovc-3,.ovc-4{bottom:5%}
}

/* ---------- Tablet (≤1024) refinements ---------- */
@media(max-width:1024px){
  .hero-inner{grid-template-columns:1.1fr .9fr}
  .hero-float{width:min(100%,300px);height:min(440px,56vh)}
  .split{gap:clamp(24px,4vw,48px)}
  .cta-box{gap:22px}
  .t-card{padding:22px}
  .team-grid{gap:14px}
  .founder{min-height:560px}
  .ab-media{aspect-ratio:16/8}
}

/* ---------- Large phones / small tablets (≤860) ---------- */
@media(max-width:860px){
  :root{--r:20px;--r-lg:26px}
  .sec{padding:clamp(56px,12vw,88px) 0}
  .nav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .nav .logo img{height:32px;max-width:150px}
  .site-header{padding-top:max(12px,env(safe-area-inset-top))}
  .hero-inner{padding:96px 0 44px;gap:24px}
  .hero-copy{max-width:none}
  .hero-copy h1{max-width:12ch}
  .hero-copy .lead{max-width:44ch}
  .hero-rating{margin-top:22px}
  .center-intro h2{max-width:16ch}
  .why-block{margin-bottom:28px}
  .why-media{margin-top:32px}
  .split .ph{aspect-ratio:4/4.4}
  .split>div:not(.ph){max-width:none}
  .t-sec{min-height:0;padding:72px 0}
  .t-card{padding:18px;gap:16px;min-height:0;margin-top:28px}
  .t-card .quote{padding:6px 4px;gap:20px}
  .faq-grid{gap:28px}
  .faq-card{margin-top:20px}
  .cta-box{padding:20px}
  .cta-box .ph{aspect-ratio:16/10}
  .flip{height:clamp(400px,62vw,480px)}
  .cards-grid,.blog-grid{gap:18px;margin-top:32px}
  .steps{gap:14px}
  .areas{gap:12px}
  .ba{aspect-ratio:4/3}
  .map,.map iframe{min-height:320px}
  .founder{padding:36px 22px;min-height:480px}
  .fgrid{gap:28px 20px}
  .fgrid p{max-width:none}
  .ct-info{gap:12px}
  .page-hero{padding:120px 0 32px}
  .ab-hero{padding:120px 0 0}
  .ab-media{margin-top:32px}
  .hw{margin-top:36px;gap:24px}
  .hw-item{grid-template-columns:44px 1fr;gap:12px;padding:26px 0}
  .hw-item p{max-width:none}

/* ===== Floating back-to-top (home page only) ===== */
.fab-top{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:90;
  width:54px;height:54px;border-radius:50%;display:none;place-items:center;color:#fff;isolation:isolate;overflow:hidden;
  background:rgba(26,26,26,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 14px 34px -10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.14);
  opacity:0;visibility:hidden;transform:translateY(18px) scale(.8);
  transition:opacity .5s var(--ease),transform .6s var(--ease-out),visibility 0s .6s,box-shadow .5s var(--ease);-webkit-tap-highlight-color:transparent}
html[data-route="/"] .fab-top{display:grid}
.fab-top.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.fab-top::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:var(--accent);transform:translateY(102%);transition:transform .6s var(--ease-out)}
.fab-top .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.fab-top .ring circle{fill:none;stroke-width:2.5}
.fab-top .ring .tr{stroke:rgba(255,255,255,.14)}
.fab-top .ring .pg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:138.23;stroke-dashoffset:138.23}
.fab-top .ar{width:18px;height:18px;display:block;transform:rotate(-90deg)}
.fab-top:active{scale:.92}

@media(hover:hover){
  .fab-top.show:hover{transform:translateY(-5px);box-shadow:0 18px 38px -10px rgba(200,121,44,.7),inset 0 0 0 1px rgba(255,255,255,.2)}
  .fab-top:hover::before{transform:none}
  .fab-top:hover .ar{animation:upLoop .85s var(--ease-out)}
  .fab-top:hover .ring .pg{stroke:#fff}
}

@media(prefers-reduced-motion:reduce){.fab-top,.fab-top::before{transition-duration:.01ms!important}.fab-top .ar{animation:none!important}}

  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%)}

/* ========================================================================
   PREMIUM BUTTON + HOVER SYSTEM
   fill grows from the exact point the cursor enters · label rolls over ·
   arrow slides through the circle · light sweep · soft lift
   ======================================================================== */
.btn{--fill:var(--accent);isolation:isolate;overflow:hidden;-webkit-tap-highlight-color:transparent;
  transition:scale .55s var(--ease-out),transform .45s var(--ease),box-shadow .55s var(--ease),color .35s var(--ease) .08s,background .45s var(--ease)}
.btn.accent,.btn.glow{--fill:var(--ink)}
.btn.ghost{--fill:var(--accent)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--fill);
  clip-path:circle(0px at var(--mx,50%) var(--my,50%));transition:clip-path .8s var(--ease-out)}
.btn::after{content:"";position:absolute;inset:-1px;z-index:1;pointer-events:none;border-radius:inherit;
  background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.34) 50%,transparent 64%);transform:translateX(-135%)}
/* rolling label */
.btn .lb{position:relative;display:inline-block;overflow:hidden;height:1.4em;line-height:1.4em;white-space:nowrap;vertical-align:middle}
.btn .lb>span{display:block;transition:transform .65s var(--ease-out)}
.btn .lb::after{content:attr(data-t);position:absolute;left:0;top:100%;transition:transform .65s var(--ease-out)}
/* arrow that slides through */
.btn .arr{position:relative;overflow:hidden;transition:background .5s var(--ease),color .5s var(--ease),scale .6s var(--ease-out)}
.btn .arr svg{transition:transform .65s var(--ease-out)}
.btn .arr svg.c{position:absolute;inset:0;margin:auto;transform:translateX(-170%)}
.btn:active{scale:.96;transition-duration:.15s}
.btn:active::before{clip-path:circle(220% at var(--mx,50%) var(--my,50%))}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:focus-visible::before{clip-path:circle(220% at 50% 50%)}
@media(hover:hover){
  .btn:hover{transform:none;scale:1.035;box-shadow:0 18px 38px -12px rgba(200,121,44,.6)}
  .btn:hover::before{clip-path:circle(220% at var(--mx,50%) var(--my,50%))}
  .btn:hover::after{transform:translateX(135%);transition:transform .95s var(--ease-out)}
  .btn:hover .lb>span,.btn:hover .lb::after{transform:translateY(-100%)}
  .btn:hover .arr{transform:none;scale:1.07;background:#fff;color:var(--accent)}
  .btn:hover .arr svg:not(.c){transform:translateX(170%)}
  .btn:hover .arr svg.c{transform:none}
}
.btn:hover{background:var(--ink)}
.btn.accent:hover{background:var(--accent)}
.btn.ghost:hover{background:rgba(26,26,26,.55)}
.ph-hero .btn.glow:hover{background:#fff;color:#fff}
.ph-hero .btn.glow:hover .arr{background:#fff;color:var(--accent)}
@media(hover:none){.btn:hover{scale:1;box-shadow:none}.btn:hover .arr svg:not(.c){transform:none}.btn:hover .arr svg.c{transform:translateX(-170%)}.btn:hover .lb>span,.btn:hover .lb::after{transform:none}}

/* nav links: underline sweep */
.nav-links a{position:relative}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1.5px;border-radius:2px;background:var(--accent);
  transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease-out)}
.nav-links a:hover::after,.nav-links a.on::after{transform:scaleX(1);transform-origin:left}

/* hero phone link */
.ph-link{position:relative}
.ph-link::after{content:"";position:absolute;left:28px;right:0;bottom:-5px;height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease-out)}
.ph-link:hover::after{transform:scaleX(1);transform-origin:left}
.ph-link:hover svg{animation:phRing .8s var(--ease) 1}
@keyframes phRing{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}35%{transform:rotate(14deg)}55%{transform:rotate(-9deg)}75%{transform:rotate(5deg)}}

/* hero cards: cursor spotlight */
a.ph-chip{overflow:hidden;isolation:isolate}
a.ph-chip::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(240px circle at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.3),transparent 65%)}
a.ph-chip:hover::before{opacity:1}

/* footer: socials + back-to-top + links */
.socials a,.totop{position:relative;overflow:hidden;isolation:isolate}
.socials a::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:var(--accent);transform:translateY(102%);transition:transform .6s var(--ease-out)}
.socials a:hover{background:rgba(255,255,255,.1);transform:translateY(-5px) rotate(-8deg);box-shadow:0 12px 26px -8px rgba(200,121,44,.65)}
.socials a:hover::before{transform:none}
.socials a svg{transition:transform .5s var(--ease-out)}

.totop{transition:transform .5s var(--ease-out),background .4s,color .4s,box-shadow .5s}

.totop:hover svg{animation:upLoop .85s var(--ease-out)}
@keyframes upLoop{0%{transform:translateY(0) rotate(-90deg);opacity:1}45%{transform:translateY(-170%) rotate(-90deg);opacity:0}46%{transform:translateY(170%) rotate(-90deg);opacity:0}100%{transform:translateY(0) rotate(-90deg);opacity:1}}
.fgrid li a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease-out)}
.fgrid li a:hover::after{transform:scaleX(1);transform-origin:left}
@media(prefers-reduced-motion:reduce){.btn,.btn *,.btn::before,.btn::after,.socials a,.totop,.nav-links a::after,.ph-link::after{transition-duration:.01ms!important;animation:none!important}}

  const box=root.querySelector('#abCollage'); if(!box)return;
  // pause the vertical rotation while off-screen / tab hidden (saves battery)
  if('IntersectionObserver' in window){abIO=new IntersectionObserver(e=>box.classList.toggle('paused',!e[0].isIntersecting),{threshold:.05});abIO.observe(box)}
  if(!window.gsap||RM)return;
  const fixed=box.querySelector('.ab-fixed'), view=box.querySelector('.ab-view');
  gsap.fromTo(fixed,{y:70,opacity:0,scale:.92},{y:0,opacity:1,scale:1,duration:1.3,ease:'power3.out',scrollTrigger:{trigger:box,start:'top 88%',once:true}});
  gsap.fromTo(view,{y:90,opacity:0},{y:0,opacity:1,duration:1.4,delay:.15,ease:'power3.out',scrollTrigger:{trigger:box,start:'top 88%',once:true}});
}


/* ========== REELS: autoplay in view, sound on click (one at a time) ========== */
let reelIO=null,reelLoadIO=null;
window.__ua=false;
['click','touchend','keydown'].forEach(ev=>addEventListener(ev,e=>{
  const first=!window.__ua; window.__ua=true;
  if(first&&!(e.target.closest&&e.target.closest('.reel')))autoSound();
},{capture:true,passive:true}));
function reelsAll(){return [...document.querySelectorAll('.reel')]}
function userActive(){return window.__ua||(navigator.userActivation&&navigator.userActivation.hasBeenActive)}
function setSound(c,on){
  const v=c.querySelector('video');
  if(on)reelsAll().forEach(o=>{if(o!==c&&o.classList.contains('snd')){o.querySelector('video').muted=true;o.classList.remove('snd')}});
  v.muted=!on; c.classList.toggle('snd',on);
}
function autoSound(){
  if(reelsAll().some(c=>c.classList.contains('snd')))return;
  const c=reelsAll().find(c=>c.classList.contains('vis')&&!c.dataset.manual&&!c.querySelector('video').paused);
  if(c)setSound(c,true);
}
function playReel(c){
  const v=c.querySelector('video');
  if(!v.src){v.src=v.dataset.src}
  const wantSound=userActive()&&!c.dataset.manual&&!reelsAll().some(o=>o!==c&&o.classList.contains('snd'));
  const go=()=>{
    if(wantSound){
      setSound(c,true);
      v.play().catch(()=>{setSound(c,false);v.play().catch(()=>{})});
    }else{v.play().catch(()=>{})}
  };
  go();
}
function setupReels(root){
  const cards=[...root.querySelectorAll('.reel')]; if(!cards.length)return;
  cards.forEach(c=>{
    const v=c.querySelector('video');
    v.addEventListener('error',()=>{c.style.display='none'});
    const toggle=()=>{
      const on=!c.classList.contains('snd');
      setSound(c,on); if(on)delete c.dataset.manual; else c.dataset.manual='1';
      if(v.paused){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}
    };
    c.addEventListener('click',toggle);
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  });
  if(!('IntersectionObserver' in window)){cards.forEach(c=>{c.querySelector('video').src=c.querySelector('video').dataset.src});return}
  reelLoadIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const v=e.target.querySelector('video');if(!v.src){v.src=v.dataset.src;v.preload='auto'}reelLoadIO.unobserve(e.target)}}),{rootMargin:'500px 0px'});
  reelIO=new IntersectionObserver(es=>es.forEach(e=>{
    const c=e.target,v=c.querySelector('video');
    if(e.intersectionRatio>=.55){c.classList.add('vis');if(!RM)playReel(c)}
    else if(e.intersectionRatio<.3){c.classList.remove('vis');v.pause();if(c.classList.contains('snd'))setSound(c,false)}
  }),{threshold:[0,.3,.55,.8]});
  cards.forEach(c=>{reelLoadIO.observe(c);reelIO.observe(c)});
}
document.addEventListener('visibilitychange',()=>{
  reelsAll().forEach(c=>{const v=c.querySelector('video');if(document.hidden)v.pause();else if(c.classList.contains('vis')&&!RM)playReel(c)});
});

/* ========== PREMIUM MENU (circle reveal from the button, staggered links, matching close) ========== */
function setMenu(o){
  const d=document.getElementById('dr'),b=document.getElementById('bg'),h=document.getElementById('hd');
  if(!d||!b)return;
  if(o){const r=b.getBoundingClientRect();d.style.setProperty('--ox',(r.left+r.width/2)+'px');d.style.setProperty('--oy',(r.top+r.height/2)+'px')}
  d.classList.toggle('open',o);d.setAttribute('aria-hidden',!o);
  b.classList.toggle('open',o);b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu');
  h.classList.toggle('menu-open',o);h.classList.remove('hide');
  document.documentElement.classList.toggle('menu-lock',o);
  if(typeof lenis!=='undefined'&&lenis){o?lenis.stop():lenis.start()}
}
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
addEventListener('resize',()=>{if(innerWidth>860)setMenu(false)});

/* ========== INTERACTIONS (delegated once) ========== */
document.addEventListener('click',e=>{
  const fq=e.target.closest('.fq button');
  if(fq){
    const item=fq.parentNode, ans=item.querySelector('.ans'), open=!item.classList.contains('open');
    document.querySelectorAll('.fq.open').forEach(o=>{
      if(o===item)return; o.classList.remove('open'); o.querySelector('button').setAttribute('aria-expanded','false');
      const a=o.querySelector('.ans');
      if(window.gsap&&!RM) gsap.to(a,{height:0,duration:.45,ease:'power3.inOut'}); else a.style.height='0px';
    });
    item.classList.toggle('open',open); fq.setAttribute('aria-expanded',open);
    const h=open?ans.scrollHeight:0;
    if(window.gsap&&!RM) gsap.to(ans,{height:h,duration:.55,ease:'power3.inOut',onComplete:()=>ScrollTrigger&&ScrollTrigger.refresh()});
    else ans.style.height=h+'px';
    return;
  }
  const fl=e.target.closest('[data-flip]');
  if(fl&&matchMedia('(hover:none)').matches){
    if(!fl.classList.contains('on')){e.preventDefault();document.querySelectorAll('[data-flip].on').forEach(x=>x.classList.remove('on'));fl.classList.add('on')}
  }
  if(e.target.closest('#bg')){setMenu(!document.getElementById('dr').classList.contains('open'))}
  else if(e.target.closest('#drx')||e.target.closest('#dr a')||(e.target.closest('#dr')&&e.target===document.getElementById('dr'))){setMenu(false)}
});
document.addEventListener('input',e=>{
  if(!e.target.matches('.ba input'))return;
  const v=e.target.value,b=e.target.parentNode;
  b.querySelector('.af').style.clipPath=`inset(0 0 0 ${v}%)`;
  b.querySelector('.hd').style.left=v+'%';
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('#ctForm'); if(!f)return; e.preventDefault();
  const d=new FormData(f);
  const t=`Hello Derma Smile, I'd like to book a consultation.\nName: ${d.get('n')}\nPhone: ${d.get('p')}\nEmail: ${d.get('e')||'-'}\nTreatment: ${d.get('t')}\nMessage: ${d.get('m')||'-'}`;
  window.open('https://wa.me/919944022114?text='+encodeURIComponent(t),'_blank','noopener');
});
// Premium buttons: split label (roll-over), twin arrow (slide-through), cursor-origin fill, card spotlight
(function(){
  const enhance=()=>{
    document.querySelectorAll('.btn:not([data-pb])').forEach(b=>{
      b.dataset.pb='1';
      const lab=[...b.children].find(c=>c.tagName==='SPAN'&&!c.classList.contains('arr'));
      if(lab&&lab.textContent.trim()){
        const w=document.createElement('span'); w.className='lb'; w.dataset.t=lab.textContent.trim();
        lab.replaceWith(w); w.appendChild(lab);
      }
      const ic=b.querySelector('.arr svg');
      if(ic&&!ic.classList.contains('c')){const c=ic.cloneNode(true); c.classList.add('c'); c.setAttribute('aria-hidden','true'); ic.parentNode.appendChild(c)}
    });
  };
  let raf=0; const queue=()=>{cancelAnimationFrame(raf); raf=requestAnimationFrame(enhance)};
  new MutationObserver(queue).observe(document.body,{childList:true,subtree:true}); enhance();
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    const origin=e=>{
      const b=e.target.closest&&e.target.closest('.btn'); if(!b||b.contains(e.relatedTarget))return;
      const r=b.getBoundingClientRect(); b.style.setProperty('--mx',(e.clientX-r.left)+'px'); b.style.setProperty('--my',(e.clientY-r.top)+'px');
    };
    document.addEventListener('pointerover',origin,true); document.addEventListener('pointerout',origin,true);
    document.addEventListener('pointermove',e=>{
      const c=e.target.closest&&e.target.closest('a.ph-chip'); if(!c)return;
      const r=c.getBoundingClientRect(); c.style.setProperty('--sx',(e.clientX-r.left)+'px'); c.style.setProperty('--sy',(e.clientY-r.top)+'px');
    },{passive:true});
  }
})();
// Magnetic buttons (desktop pointers)
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!RM){
  document.addEventListener('pointermove',e=>{
    const b=e.target.closest&&e.target.closest('.btn:not(.accent)'); if(!b||!window.gsap)return;
    const r=b.getBoundingClientRect();
    gsap.to(b,{x:(e.clientX-r.left-r.width/2)*.18,y:(e.clientY-r.top-r.height/2)*.3,duration:.4,ease:'power3.out',overwrite:'auto'});
  });
  document.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('.btn:not(.accent)'); if(b&&window.gsap&&!b.contains(e.relatedTarget))gsap.to(b,{x:0,y:0,duration:.7,ease:'elastic.out(1,.5)',overwrite:'auto'})});
}
// Floating back-to-top (home page only): appears after scrolling, shows scroll progress, hides over the footer
(function(){
  const fab=document.getElementById('fabTop'); if(!fab)return;
  const pg=fab.querySelector('.pg'), C=138.23, ft=document.querySelector('.site-footer');
  const upd=()=>{
    const home=document.documentElement.dataset.route==='/';
    const y=scrollY||0, max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
    pg.style.strokeDashoffset=(C*(1-Math.min(1,y/max))).toFixed(1);
    const overFooter=ft&&ft.getBoundingClientRect().top<innerHeight-60;
    fab.classList.toggle('show',home&&y>Math.min(500,innerHeight*.6)&&!overFooter);
  };
  addEventListener('scroll',upd,{passive:true}); addEventListener('resize',upd);
  window.__fabUpdate=upd;
  fab.addEventListener('click',()=>{lenis?lenis.scrollTo(0,{duration:1.5}):scrollTo({top:0,behavior:'smooth'})});
})();
// Hide header on scroll down
addEventListener('scroll',()=>{
  const y=scrollY||0; const hd=document.getElementById('hd');
  if(y>120&&y>lastY) hd.classList.add('hide'); else hd.classList.remove('hide');
  lastY=y;
  document.getElementById("prog").style.transform="scaleX("+(y/Math.max(1,document.documentElement.scrollHeight-innerHeight))+")";
},{passive:true});

/* ========== LOADER (ripple wipe from the click point + filling droplet) ========== */
let ldTl=null, clickPt={x:50,y:50};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]'); if(a)clickPt={x:Math.round(e.clientX/innerWidth*100),y:Math.round(e.clientY/innerHeight*100)}},true);
const LBL={'/':'Home','/about':'About','/treatments':'Treatments','/treatments/laser-hair-reduction':'Laser Hair Reduction','/treatments/skin-treatment':'Skin Treatment','/treatments/hair-treatment':'Hair Treatment','/blog':'Journal','/contact':'Contact','404':'Page not found'};
function runLoader(page,first,onCovered){
  const L=document.getElementById('loader'), num=document.getElementById('ldNum'), o={n:0};
  if(ldTl)ldTl.kill();
  document.getElementById('ldLabel').textContent=first?'Preparing your care':(LBL[page]||'');
  const pt=first?{x:50,y:50}:clickPt, E=first?0:.75, F=first?1.6:.55, S=first?.15:.3;
  const open=`circle(0% at ${pt.x}% ${pt.y}%)`, full=`circle(150% at ${pt.x}% ${pt.y}%)`;
  num.textContent='0';
  gsap.set(L,{visibility:'visible',pointerEvents:'auto',clipPath:first?full:open});
  gsap.set('#ldr',{attr:{y:80}}); gsap.set('.ld-in>*',{opacity:0,y:22}); gsap.set('.ld-bar i',{scaleX:0});
  ldTl=gsap.timeline();
  ldTl.to(L,{clipPath:full,duration:E,ease:'power3.inOut'},0)
    .to('.ld-in>*',{opacity:1,y:0,duration:.6,stagger:.08,ease:'power3.out'},S)
    .to('#ldr',{attr:{y:0},duration:F,ease:'power1.inOut'},S)
    .to('.ld-bar i',{scaleX:1,duration:F,ease:'power1.inOut'},S)
    .to(o,{n:100,duration:F,ease:'power1.inOut',onUpdate:()=>{num.textContent=Math.round(o.n)}},S)
    .to('.ld-in>*',{opacity:0,y:-18,duration:.35,stagger:.04,ease:'power2.in'},S+F+(first?.35:.1))
    /* swap the page only once the loader content has faded, then open the loader a beat later,
       so the new page's entrance animations play while it is being revealed (not hidden behind it) */
    .add(onCovered,'>-.05')
    .to(L,{clipPath:'circle(0% at 50% 50%)',duration:1.05,ease:'power3.inOut'},'>.12')
    .set(L,{visibility:'hidden',pointerEvents:'none'});
}
if(!window.gsap||RM){document.getElementById('loader').style.display='none'}
setTimeout(()=>{if(!window.gsap)document.getElementById('loader').style.display='none'},4000);

/* ========== ROUTER ========== */
const app=document.getElementById('app');
function route(){
  let r=(location.hash.replace(/^#/,'')||'/').split('?')[0];
  if(r.length>1)r=r.replace(/\/$/,'');
  const page=P[r]?r:'404';
  document.documentElement.dataset.route=page;
  if(window.__fabUpdate)window.__fabUpdate();
  killAnims();
  setMenu(false);
  const swap=()=>{
    app.innerHTML=P[page]();
    splitWords(app);
    if(lenis)lenis.scrollTo(0,{immediate:true}); else window.scrollTo(0,0);
    document.querySelectorAll('#links a').forEach(a=>{
      const on=a.dataset.r===r||(a.dataset.r==='/treatments'&&r.startsWith('/treatments'));
      a.classList.toggle('on',on);
    });
    const titles={ '/':'Skin, Hair, Laser & Slimming','/about':'About','/treatments':'Treatments','/treatments/laser-hair-reduction':'Laser Hair Reduction','/treatments/skin-treatment':'Skin Treatment','/treatments/hair-treatment':'Hair Treatment','/blog':'Blog','/contact':'Contact','404':'Page not found'};
    document.title=`${titles[page]||'Derma Smile'} | Derma Smile Aesthetic Clinic`;
    animate(app);
    setupTestimonials(app);
    setupCollage(app);
    setupReels(app);
    setupPageHero(app);
    if(window.ScrollTrigger){
      ScrollTrigger.refresh();
      app.querySelectorAll('img').forEach(i=>i.addEventListener('load',()=>ScrollTrigger.refresh(),{once:true}));
    }
    if(window.__fabUpdate)setTimeout(window.__fabUpdate,200);
    if(window.gsap&&!RM) gsap.fromTo(app,{opacity:0},{opacity:1,duration:.9,ease:'power2.out',clearProps:'opacity'});
  };
  if(window.gsap&&!RM) runLoader(page,!app.innerHTML,swap);
  else swap();
}
if(!window.gsap) document.head.insertAdjacentHTML('beforeend','<style>.u>span{transform:none!important}</style>');
initLenis();
addEventListener('hashchange',route);
route();
